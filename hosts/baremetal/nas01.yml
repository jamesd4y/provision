hostname: nas01
fqdn: nas01.lan
description: Storage box. Declared specs are verified against facts, never applied.
enabled: true
tags:
  - baremetal
  - storage

hardware:
  cpu: 8
  memory: 32768
  architecture: x86
  storage:
    - name: root
      size: 250
      type: ssd
      mount: /
    - name: tank
      size: 16000
      type: hdd
      mount: /srv/tank
      format: none   # pre-existing ZFS pool; the disk role leaves it alone

os:
  distribution: debian
  version: "13"

network:
  ipv4: 10.20.0.10
  private_ipv4: 10.20.0.10

ansible:
  user: deploy
  roles:
    - base
    - tailscale
    - docker
    - firewall
    - node_exporter
    - backup

dns:
  zone: example.com
  record: null   # private box, no public record

services:
  - name: vector
    env:
      VICTORIALOGS_ENDPOINT: http://db01.tail1a2b3c.ts.net:9428

  - name: cadvisor

  - name: vmagent
    env:
      VICTORIAMETRICS_ENDPOINT: http://db01.tail1a2b3c.ts.net:8428

  - name: postgres
    secrets:
      POSTGRES_PASSWORD: postgres/nas_password
    env:
      POSTGRES_DB: scratch
      POSTGRES_USER: scratch
