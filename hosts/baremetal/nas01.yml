hostname: nas01
fqdn: nas01.lan
description: Storage box. Declared specs are verified against facts, never applied.
enabled: true
tags:
  - baremetal
  - storage

hardware:
  cpu: 8
  memory: 32768
  architecture: x86
  storage:
    - name: root
      size: 250
      type: ssd
      mount: /
    - name: tank
      size: 16000
      type: hdd
      mount: /srv/tank
      format: none   # pre-existing ZFS pool; the disk role leaves it alone

os:
  distribution: debian
  version: "13"

network:
  ipv4: 10.20.0.10
  private_ipv4: 10.20.0.10
  firewall:
    - name: ssh
      port: "22"
      source:
        - 10.20.0.0/24
    - name: victorialogs
      port: "9428"
      source:
        - 10.20.0.0/24

ansible:
  user: deploy
  roles:
    - base
    - docker
    - node_exporter

dns:
  zone: example.com
  record: null   # private box, no public record

services:
  - name: vector
    env:
      VICTORIALOGS_ENDPOINT: http://10.20.0.10:9428

  - name: victoria-logs
    env:
      VICTORIALOGS_BIND: 10.20.0.10
      VICTORIALOGS_RETENTION: 180d
      VICTORIALOGS_MAX_DISK_BYTES: "536870912000"   # 500 GiB of the tank
    volumes_root: /srv/tank/victoria-logs

  - name: postgres
    secrets:
      POSTGRES_PASSWORD: postgres/nas_password
    env:
      POSTGRES_DB: scratch
      POSTGRES_USER: scratch
