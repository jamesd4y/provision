# Internal only: no Traefik router, listens on the private network address of
# whichever host binds it. The cloud firewall in that host's YAML is what keeps
# 5432 private, so do not remove that rule.
x-provision:
  description: PostgreSQL 17 for internal consumers.
  ingress: none
  singleton: false
  required_env:
    - POSTGRES_PASSWORD
  optional_env:
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres
    POSTGRES_BIND: 0.0.0.0
    POSTGRES_PORT: "5432"
  data_dirs:
    - data
  backup:
    # Deliberately NOT the data directory: copying live Postgres files gives
    # you a torn page you will discover at restore time. pg_dumpall runs against
    # the running server and is consistent by construction, with no downtime.
    paths: []
    pre:
      - >-
        docker exec -i postgres sh -c
        'pg_dumpall -U "$POSTGRES_USER" --clean --if-exists'
        > "$STAGING/all.sql"
    post:
      - rm -f "$STAGING/all.sql"

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND}:${POSTGRES_PORT}:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
