x-provision:
  description: Uptime Kuma status page and probe runner.
  ingress: traefik
  port: 3001
  requires:
    - traefik
  data_dirs:
    - data
  healthcheck_url: http://localhost:3001/

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ${DATA_ROOT}/data:/app/data
    networks:
      - edge
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  edge:
    external: true
