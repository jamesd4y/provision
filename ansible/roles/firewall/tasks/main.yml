---
# nftables filters traffic terminating on the host. It deliberately does NOT try
# to filter published container ports: Docker DNATs those in the ip nat table
# before the inet filter input chain ever sees them. Keep container exposure
# under control by binding published ports to a private or tailnet-only address
# (see services/victoria-logs.yml) and by the cloud firewall in the host's YAML,
# which is enforced outside the machine and cannot be bypassed from inside it.
- name: Refuse to build a ruleset that leaves the host unreachable
  ansible.builtin.assert:
    that:
      - (firewall_trust_tailscale | bool) or (firewall_public_ssh | bool)
    fail_msg: >-
      {{ inventory_hostname }} would have no way in: it is not on the tailnet and
      network.public_ssh is false. Set one of them in
      hosts/{{ provision_provider }}/{{ inventory_hostname }}.yml.
    success_msg: "reachable via {{ 'the tailnet' if firewall_trust_tailscale | bool else 'public SSH' }}"
  tags: [firewall]

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
  tags: [firewall]

- name: Write the ruleset
  ansible.builtin.template:
    src: provision.nft.j2
    dest: /etc/nftables.conf
    mode: "0644"
    validate: nft -c -f %s
  notify: Reload nftables
  tags: [firewall]

- name: Enable nftables
  ansible.builtin.service:
    name: nftables
    state: "{{ 'started' if firewall_enabled else 'stopped' }}"
    enabled: "{{ firewall_enabled }}"
  tags: [firewall]
