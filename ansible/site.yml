---
# The whole fleet, or whatever --limit narrows it to.
#
#   cd ansible
#   ansible-playbook site.yml
#   ansible-playbook site.yml --limit web01
#   ansible-playbook site.yml --limit tag_prod --check --diff
#
# Roles come from each host's ansible.roles list and run in that order, so a
# host controls its own convergence sequence without editing this file.
- name: Configure hosts
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Report what this host declares
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ provision_provider }}/{{ provision_kind }}):
          roles={{ provision_roles | join(',') }}
          services={{ provision_services | map(attribute='name') | list | join(',') or 'none' }}
      tags: [always]

  tasks:
    - name: Apply declared roles in order
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        apply:
          tags: ["{{ role_name }}"]
      loop: "{{ provision_roles }}"
      loop_control:
        loop_var: role_name
      tags: [always]
