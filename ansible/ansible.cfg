[defaults]
# The inventory is generated from hosts/ — there is no static inventory file.
inventory            = ../scripts/inventory.py
roles_path           = roles
# community.general.yaml was removed in community.general 12.0.0; the built-in
# default callback with result_format=yaml replaces it.
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = ansible.posix.profile_tasks, ansible.posix.timer
host_key_checking    = True
interpreter_python   = auto_silent
forks                = 10
retry_files_enabled  = False
display_skipped_hosts = False
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout = 3600

[ssh_connection]
pipelining  = True
ssh_args    = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
