# Zones this repo is allowed to touch. Anything not listed here is rejected by
# scripts/validate.py, so a typo in a domain cannot silently create a record in
# the wrong zone.
#
# account_id and api_token are Bitwarden Secrets Manager keys, not values.
# The token needs Zone:Read + DNS:Edit on exactly these zones.
account_id: cloudflare/account_id
api_token: cloudflare/dns_api_token

defaults:
  ttl: 1          # 1 = "automatic"
  proxied: true   # service records are orange-clouded by default
  comment_prefix: managed-by:provision

zones:
  example.com:
    zone_id: 0123456789abcdef0123456789abcdef
    enabled: true
    default_proxied: true
    records:
      - name: "@"
        type: MX
        value: route1.mx.cloudflare.net
        priority: 10
        comment: email routing
      - name: "@"
        type: TXT
        value: "v=spf1 include:_spf.mx.cloudflare.net ~all"
      - name: _dmarc
        type: TXT
        value: "v=DMARC1; p=reject; rua=mailto:dmarc@example.com"
